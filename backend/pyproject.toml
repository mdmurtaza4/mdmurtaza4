[project]
name = "elixir-studio"
version = "0.1.0"
description = "ELiXIR AI Video Studio - local processing engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "faster-whisper>=1.1",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
vision = ["scenedetect>=0.6", "opencv-python>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs Whisper transcription"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
